name: "Tests"
on: ["push", "pull_request"]

jobs:
  tests:
    name: "Go ${{ matrix.go.series }}"
    runs-on: "ubuntu-24.04"
    container:
      image: "docker://gcr.io/bazel-public/bazel:7.4.1"
      options: --user root

    strategy:
      matrix:
        go:
          - series: "1.22"
            version: "1.22.12"
          - series: "1.23"
            version: "1.23.8"
          - series: "1.24"
            version: "1.24.2"

    steps:
      - uses: "actions/checkout@v4"
        with:
          path: "src"
      - uses: "actions/cache@v4"
        with:
          path: cache
          key: "os=${{ matrix.os }};go=${{ matrix.go.version }};v=1"
      - name: "Prepare workspace"
        run: |
          echo "GO_VERSION = '${GO_VERSION}'" > src/build/go_version.bzl
        env:
          GO_VERSION: ${{ matrix.go.version }}
      - name: "bazel test //..."
        working-directory: src
        run: |
          exec bazel test \
            --announce_rc \
            --curses=no \
            --color=yes \
            --verbose_failures \
            --test_output=errors \
            --test_verbose_timeout_warnings \
            --repository_cache="$GITHUB_WORKSPACE/cache/repository_cache" \
            --disk_cache="$GITHUB_WORKSPACE/cache/disk_cache" \
            //...
